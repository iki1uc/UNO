<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>leben · iki1uc · runtime umgebung</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#000;color:#0f0;font-family:monospace;padding:14px;font-size:11px}
  h1{font-size:14px;letter-spacing:3px;margin:0 0 4px;color:#0f0}
  .sub{color:#6cf;font-size:9px;margin-bottom:10px}
  .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
  .cell{background:#0a0a0a;border:1px solid #333;padding:8px;border-radius:6px}
  .cell.alive{border-color:#0f0;box-shadow:0 0 10px rgba(0,255,0,.2)}
  .cell.dead{border-color:#f33;opacity:.4}
  .cell h3{margin:0 0 5px;color:#6cf;font-size:10px}
  .beat{font-size:20px;text-align:center;margin:4px 0}
  .beat.on{color:#0f0;animation:pulse .8s infinite}
  @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
  iframe{width:100%;height:340px;background:#000;border:1px solid #222;border-radius:6px}
  .bar{background:#0a0a0a;border:1px solid #0f0;padding:8px;border-radius:6px;white-space:pre-wrap;font-size:9px;margin-bottom:8px;max-height:140px;overflow:auto}
  .trigger{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}
  .trigger button{background:#111;color:#0f0;border:1px solid #0f0;padding:5px 10px;cursor:pointer;border-radius:4px;font-family:monospace;font-size:10px}
  .trigger button:hover{background:#0f0;color:#000}
  .trigger button.pulse{border-color:#6cf;color:#6cf}
  .trigger button.fire{border-color:#f0d080;color:#f0d080}
</style>
</head>
<body>
<h1>leben · runtime umgebung</h1>
<div class="sub">RESPO·HUB (Sensor) ←→ Wirt ←→ ANKER/UNO (Puls) — trigger · überleben · leben</div>

<div class="grid">
  <div class="cell" id="c-hub">
    <h3>RESPO·HUB · Sensor</h3>
    <div class="beat" id="b-hub">·</div>
    <div style="font-size:9px;color:#888" id="s-hub">warte auf Signal…</div>
  </div>
  <div class="cell alive" id="c-wirt">
    <h3>WIRT · Bus</h3>
    <div class="beat on" id="b-wirt">♥</div>
    <div style="font-size:9px;color:#888" id="s-wirt">0 Trigger · 0 alive</div>
  </div>
  <div class="cell" id="c-uno">
    <h3>ANKER/UNO · Puls</h3>
    <div class="beat" id="b-uno">·</div>
    <div style="font-size:9px;color:#888" id="s-uno">warte auf Signal…</div>
  </div>
</div>

<div class="trigger">
  <button data-fire="hub→uno">RESPO·HUB → ANKER/UNO</button>
  <button data-fire="uno→hub">ANKER/UNO → RESPO·HUB</button>
  <button data-fire="loop" class="pulse">∞ Trigger-Loop starten</button>
  <button data-fire="kill-hub" class="fire">Sensor töten (Test)</button>
  <button data-fire="kill-uno" class="fire">Puls töten (Test)</button>
  <button data-fire="revive">Beide wiederbeleben</button>
</div>

<div class="bar" id="log">[wirt] boot · lade zwei organismen…</div>

<div class="grid">
  <div style="grid-column:span 1"><iframe id="frame-hub" src="index.html"></iframe></div>
  <div style="grid-column:span 2"><iframe id="frame-uno" src="index.html"></iframe></div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════
   LEBEN · RUNTIME · TRIGGER-SYSTEM
   Zwei Organismen — ein Wirt — ein Kreislauf des Überlebens
   ═══════════════════════════════════════════════════════════════ */

const WIRT = {
  hub:   { alive:false, last:0, beat:0 },
  uno:   { alive:false, last:0, beat:0 },
  triggerCount: 0,
  aliveCount: 0,
  lifeInterval: null,
  triggerInterval: null,
  started: Date.now()
};

function log(msg){
  const el = document.getElementById("log");
  const t = new Date().toLocaleTimeString("de-DE");
  el.textContent = `[${t}] ${msg}\n` + el.textContent;
  if(el.textContent.length > 2000) el.textContent = el.textContent.slice(0,2000);
}

// ── Herzschlag: beide senden "ich lebe" ─────────
function lifeLoop(){
  const now = Date.now();
  for(const key of ["hub","uno"]){
    const o = WIRT[key];
    const iframe = document.getElementById("frame-"+key);
    try {
      // Prüfen ob iframe lebt (contentWindow erreichbar)
      const ok = iframe && iframe.contentWindow;
      if(ok){
        o.last = now;
        o.beat++;
        o.alive = true;
      } else {
        o.alive = false;
      }
    } catch(e){
      o.alive = false;
    }
  }
  WIRT.aliveCount = (WIRT.hub.alive?1:0) + (WIRT.uno.alive?1:0);
  renderLife();
}

// ── Trigger: sende eine Nachricht an beide ──────
function fire(from, to, payload){
  WIRT.triggerCount++;
  const beat = { from, to, payload, t: Date.now() };
  log(`⚡ trigger ${from} → ${to} : ${JSON.stringify(payload || {})}`);

  // An beide Organismen senden (postMessage)
  ["hub","uno"].forEach(k => {
    const frame = document.getElementById("frame-"+k);
    try {
      frame.contentWindow.postMessage({ type:"leben.trigger", ...beat }, "*");
    } catch(e){
      log(`✗ ${k} nicht erreichbar: ${e.message}`);
    }
  });
  renderLife();
}

// ── Überlebens-Regel: wenn einer stirbt, übernimmt der andere
function survive(){
  const hubAlive = WIRT.hub.alive;
  const unoAlive = WIRT.uno.alive;

  if(hubAlive && !unoAlive){
    log("⚠ Puls tot — Sensor übernimmt alle Trigger allein");
    // Sensor triggert sich selbst weiter
  }
  if(!hubAlive && unoAlive){
    log("⚠ Sensor tot — Puls übernimmt alle Trigger allein");
  }
  if(!hubAlive && !unoAlive){
    log("✗✗ BEIDE TOT — Wirt hält Wärme, warte auf revive()");
  }
  if(hubAlive && unoAlive){
    // Kreislauf: gegenseitige Trigger
    if(Math.random() > 0.7){
      fire("hub","uno", { earg: true, co2: Math.floor(Math.random()*100) });
    }
    if(Math.random() > 0.7){
      fire("uno","hub", { blüht: true, tick: WIRT.triggerCount });
    }
  }
}

// ── Rendering ──────────────────────────────────
function renderLife(){
  document.getElementById("b-hub").className   = "beat " + (WIRT.hub.alive ? "on":"");
  document.getElementById("b-uno").className   = "beat " + (WIRT.uno.alive ? "on":"");
  document.getElementById("c-hub").className   = "cell " + (WIRT.hub.alive ? "alive":"dead");
  document.getElementById("c-uno").className   = "cell " + (WIRT.uno.alive ? "alive":"dead");

  const age = ((Date.now() - WIRT.started)/1000).toFixed(0);
  document.getElementById("s-hub").textContent  = WIRT.hub.alive  ? `lebt · ${WIRT.hub.beat} Herzschläge` : "kein Signal";
  document.getElementById("s-uno").textContent  = WIRT.uno.alive  ? `lebt · ${WIRT.uno.beat} Herzschläge` : "kein Signal";
  document.getElementById("s-wirt").textContent = `${WIRT.triggerCount} Trigger · ${WIRT.aliveCount}/2 alive · ${age}s`;
}

// ── Buttons ────────────────────────────────────
document.querySelectorAll(".trigger button").forEach(btn => {
  btn.addEventListener("click", () => {
    const fire_cmd = btn.dataset.fire;
    if(fire_cmd === "hub→uno") fire("hub","uno", { manual:true });
    else if(fire_cmd === "uno→hub") fire("uno","hub", { manual:true });
    else if(fire_cmd === "loop"){
      if(WIRT.triggerInterval){ clearInterval(WIRT.triggerInterval); WIRT.triggerInterval=null; btn.textContent="∞ Trigger-Loop starten"; log("⏸ Loop gestoppt"); }
      else { WIRT.triggerInterval = setInterval(survive, 1200); btn.textContent="⏸ Loop stoppen"; log("▶ Loop gestartet — gegenseitiges Triggern"); }
    }
    else if(fire_cmd === "kill-hub"){ WIRT.hub.alive=false; document.getElementById("frame-hub").src="about:blank"; log("☠ Sensor getötet (Test)"); renderLife(); }
    else if(fire_cmd === "kill-uno"){ WIRT.uno.alive=false; document.getElementById("frame-uno").src="about:blank"; log("☠ Puls getötet (Test)"); renderLife(); }
    else if(fire_cmd === "revive"){
      document.getElementById("frame-hub").src="index.html";
      document.getElementById("frame-uno").src="index.html";
      WIRT.hub.alive=true; WIRT.uno.alive=true;
      log("↻ beide wiederbelebt"); renderLife();
    }
  });
});

// ── Nachrichten von Organismen empfangen ───────
window.addEventListener("message", (e) => {
  const d = e.data || {};
  if(d.type === "leben.iAmAlive"){
    if(d.who && WIRT[d.who]) WIRT[d.who].last = Date.now();
  }
  if(d.type === "leben.hubEvent"){
    fire("hub","uno", d.payload);
  }
  if(d.type === "leben.unoEvent"){
    fire("uno","hub", d.payload);
  }
});

// ── Boot ───────────────────────────────────────
lifeLoop();
WIRT.lifeInterval = setInterval(lifeLoop, 800);
log("🌱 Wirt gestartet · zwei Organismen geladen · Herzschlag 800ms");
log("⌨ Trigger-Loop: gegenseitiges Triggern alle 1.2s");
</script>
</body>
</html>
